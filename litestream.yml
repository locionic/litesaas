# Litestream Continuous Streaming S3 Replication
# Docs: https://litestream.io
dbs:
  # The same DATABASE_URL the app opens and the CMD restores. Litestream expands
  # ${VAR} from its own environment — already relied on for the bucket below.
  # A literal here instead would mean a different file the moment anyone changed
  # DATABASE_URL: the app writes one database while replication faithfully ships
  # another, one nothing ever writes, so the backups look healthy and restore
  # nothing. That failure has no error message, which is the whole problem.
  - path: ${DATABASE_URL}
    replicas:
      - type: s3
        bucket: "${LITESTREAM_BUCKET}"
        path: "backups/app.db"
        endpoint: "${LITESTREAM_ENDPOINT}"
        access-key-id: "${LITESTREAM_ACCESS_KEY_ID}"
        secret-access-key: "${LITESTREAM_SECRET_ACCESS_KEY}"
        sync-interval: 1s
